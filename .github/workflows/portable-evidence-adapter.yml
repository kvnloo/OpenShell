name: Portable Evidence Adapter

permissions:
  contents: read

on:
  pull_request:
    branches:
      - feat/3694-podman-doctor-check
    paths:
      - 'experiments/portable_evidence/**'

jobs:
  python-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/portable_evidence/test_doctor_evidence.py

  podman-doctor-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust 1.94
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - name: Build OpenShell CLI
        run: cargo build -p openshell-cli --locked
      - name: Run isolated Podman doctor proof
        env:
          OPENSHELL_BIN: ${{ github.workspace }}/target/debug/openshell
        run: |
          cargo test             --manifest-path e2e/rust/Cargo.toml             --features e2e-docker             --test docker_preflight             doctor_check_passes_with_only_podman             -- --exact --nocapture
