name: Portable Evidence

permissions:
  contents: read

on:
  push:
    branches:
      - exp/portable-evidence-v0

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test normalizer
        run: python experiments/portable_evidence/test_doctor_evidence.py
      - name: Generate replay receipt
        env:
          REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          path = Path("experiments/portable_evidence/doctor_evidence.py")
          spec = importlib.util.spec_from_file_location("doctor_evidence", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          receipt = module.normalize_doctor_result(
              revision=os.environ["REVISION"],
              driver="podman",
              returncode=0,
          )
          assert receipt["outcome"] == "pass"
          with open("portable-evidence.json", "w", encoding="utf-8") as stream:
              json.dump(receipt, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: portable-evidence-openshell-${{ github.sha }}
          path: portable-evidence.json
